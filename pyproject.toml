[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hotflash-sim"
dynamic = ["version"]
description = "Simulator of menopausal hot flashes: KNDy pulse generator, thermoregulation, vagal dynamics, EDA, wrist PPG/PRV and skin temperature, with labelled artifacts and a real-time stream"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "statsmodels>=0.14"]
keywords = ["menopause", "hot flash", "electrodermal activity", "PPG", "pulse rate variability",
            "physiological simulation", "wearables", "synthetic data"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
hotflash-sim = "hotflash_sim.__main__:main"

[tool.setuptools]
packages = ["hotflash_sim"]

[tool.setuptools.dynamic]
version = {attr = "hotflash_sim.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
